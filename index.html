<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#181a1f">
    <title>Máy Tính Casio Online - Giả Lập Casio 580, 570, 880BTG Trực Tuyến Miễn Phí</title>
    <meta name="description" content="Máy tính online & máy tính casio online miễn phí. Giả lập máy tính casio fx-580vn plus, casio 580 online, máy tính casio 570 online trên web và điện thoại cực chuẩn xác.">
    <style>
        :root {
            --bg-app: #f3f5f8;
            --bg-panel: #ffffff;
            --border-light: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --calc-body: #181a1f;
            --calc-border: #2c303a;
            --lcd-bg: #dbe3d0;
            --lcd-text: #111810;
            --btn-dark: #252830;
            --btn-dark-hover: #323642;
            --btn-num: #f8fafc;
            --btn-num-hover: #e2e8f0;
            --btn-blue: #1d63dc;
            --btn-blue-hover: #1752b8;
            --shift-color: #eab308;
            --alpha-color: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-app); color: var(--text-main); line-height: 1.5; }
        .top-header { background: #ffffff; border-bottom: 1px solid var(--border-light); height: 52px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .brand-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: var(--primary); }
        .brand-logo span.badge { background: var(--primary-soft); color: var(--primary); font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
        .app-workspace { display: grid; grid-template-columns: 320px 380px 1fr; gap: 14px; max-width: 1440px; margin: 14px auto; padding: 0 14px; min-height: calc(100vh - 80px); align-items: start; }
        .side-panel { background: var(--bg-panel); border: 1px solid var(--border-light); border-radius: 12px; overflow: hidden; height: 760px; display: flex; flex-direction: column; }
        .panel-tabs { display: flex; border-bottom: 1px solid var(--border-light); background: #f8fafc; padding: 6px 8px 0; gap: 4px; }
        .tab-btn { flex: 1; padding: 8px 10px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 8px 8px 0 0; }
        .tab-btn.active { background: #ffffff; color: var(--primary); border-bottom: 2px solid var(--primary); }
        .panel-body { padding: 14px; overflow-y: auto; flex: 1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .var-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .var-name { color: var(--primary); font-style: italic; font-weight: 600; width: 65px; }
        .var-val { flex: 1; font-family: "Consolas", monospace; color: var(--text-main); }
        .calculator-shell { background: var(--calc-body); border: 3px solid var(--calc-border); border-radius: 22px; padding: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.22); }
        .lcd-screen { background: var(--lcd-bg); color: var(--lcd-text); border-radius: 10px; padding: 10px 12px; min-height: 195px; display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 12px; }
        .lcd-prev-expr { font-size: 15px; color: #2c3529; }
        .lcd-prev-res { font-size: 20px; font-weight: 700; text-align: right; font-family: "Consolas", monospace; }
        #calc-input { width: 100%; background: transparent; border: none; outline: none; font-size: 20px; font-weight: 600; color: var(--lcd-text); font-family: "Consolas", monospace; }
        .seo-container { max-width: 1180px; margin: 30px auto 50px; background: #ffffff; border: 1px solid var(--border-light); border-radius: 14px; padding: 34px; }
        .seo-container h1 { font-size: 26px; color: #0f172a; margin-bottom: 14px; }
        .seo-container p { color: #334155; margin-bottom: 14px; font-size: 15px; line-height: 1.75; }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="brand-logo">
            <span>∑ Máy Tính Casio Online</span>
            <span class="badge">fx-580VN X • 880BTG</span>
        </div>
    </header>
    <main class="app-workspace">
        <section class="side-panel">
            <div class="panel-tabs">
                <button class="tab-btn active">Biến nhớ</button>
            </div>
            <div class="panel-body">
                <div class="tab-content active">
                    <div class="var-row"><span class="var-name">a =</span><span class="var-val">0</span></div>
                    <div class="var-row"><span class="var-name">b =</span><span class="var-val">0</span></div>
                    <div class="var-row"><span class="var-name">x =</span><span class="var-val">0</span></div>
                </div>
            </div>
        </section>
        <section class="calculator-shell">
            <div class="lcd-screen">
                <div class="lcd-top-history">
                    <div class="lcd-prev-expr">7 × 8</div>
                    <div class="lcd-prev-res">56</div>
                </div>
                <div class="lcd-input-row">
                    <input type="text" id="calc-input" value="7 * 8" placeholder="Nhập biểu thức...">
                </div>
            </div>
        </section>
        <section class="side-panel">
            <div class="panel-tabs"><button class="tab-btn active">Công thức</button></div>
            <div class="panel-body"><p style="font-size:13px; color:#64748b;">Hệ thống công thức Casio trực tuyến.</p></div>
        </section>
    </main>
    <article class="seo-container">
        <h1>Máy Tính Casio Online - Giả Lập Casio 580, 570 Tốt Nhất</h1>
        <p>Chào mừng bạn đến với công cụ máy tính casio online hàng đầu Việt Nam.</p>
    </article>
</body>
</html>
