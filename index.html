<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Casio Online - Giả Lập Máy Tính Cầm Tay Tốt Nhất</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 20px; }
        .calculator { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; margin-bottom: 30px; }
        #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 15px; padding: 5px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 18px; cursor: pointer; background: #333; color: #fff; border: none; border-radius: 6px; transition: 0.2s; }
        button:hover { background: #444; }
        button.operator { background: #e67e22; }
        button.operator:hover { background: #d35400; }
        button.function { background: #2980b9; }
        button.function:hover { background: #2471a3; }
        button.ac { background: #c0392b; }
        button.ac:hover { background: #a93226; }
    </style>
</head>
<body>

    <!-- Asal Casio Calculator Design -->
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button class="function" onclick="calculateSin()">sin</button>
            <button class="function" onclick="calculateCos()">cos</button>
            <button class="function" onclick="calculateSquare()">x²</button>
            <button class="ac" onclick="clearDisplay()">AC</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('*')">*</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button class="operator" onclick="appendValue('=')">=</button>
        </div>
    </div>

    <!-- JavaScript Functions -->
    <script>
    function appendValue(val) {
        let display = document.getElementById("display");
        if (display) display.value += val;
    }

    function clearDisplay() {
        let display = document.getElementById("display");
        if (display) display.value = "";
    }

    function calculateSquare() {
        let display = document.getElementById("display");
        if (!display) return;
        let val = parseFloat(display.value);
        if (isNaN(val)) {
            display.value = "Error";
        } else {
            display.value = val * val;
        }
    }

    function calculateSin() {
        let display = document.getElementById("display");
        if (!display) return;
        let val = parseFloat(display.value);
        if (isNaN(val)) {
            display.value = "Error";
        } else {
            let radians = val * (Math.PI / 180);
            display.value = Math.sin(radians);
        }
    }

    function calculateCos() {
        let display = document.getElementById("display");
        if (!display) return;
        let val = parseFloat(display.value);
        if (isNaN(val)) {
            display.value = "Error";
        } else {
            let radians = val * (Math.PI / 180);
            display.value = Math.cos(radians);
        }
    }
    </script>

    <!-- FULL SEO OPTIMIZED CONTENT SECTION -->
    <section class="seo-content-section" style="max-width: 900px; margin: 40px auto; padding: 25px; font-family: Arial, sans-serif; color: #e0e0e0; line-height: 1.7; background: #1e1e1e; border-radius: 12px; border: 1px solid #333;">
        <h1 style="font-size: 26px; color: #3498db; margin-bottom: 15px;">Máy Tính Casio Online - Giả Lập Máy Tính Cầm Tay Tốt Nhất Hiện Nay</h1>
        <p>Chào mừng bạn đến với công cụ <strong>máy tính casio online</strong> hàng đầu, nơi cung cấp giải pháp <strong>máy tính online casio</strong> mượt mà và chuẩn xác nhất.</p>
    </section>

</body>
</html>
