<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính Casio Online - fx-580VN X & 570VN PLUS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator {
            background: #2c3e50;
            width: 360px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #34495e;
        }
        .brand {
            color: #ecf0f1;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .screen {
            background: #c8d6e5;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 2px inset #8395a7;
            text-align: right;
            min-height: 50px;
        }
        .expression {
            font-size: 14px;
            color: #222;
            height: 20px;
            overflow: hidden;
        }
        .result {
            font-size: 22px;
            font-weight: bold;
            color: #111;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .btn {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #f1f2f6;
            color: #2f3640;
            box-shadow: 0 3px #dcdde1;
            transition: all 0.1s ease;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px #dcdde1;
        }
        .btn-sci {
            background: #718093;
            color: #fff;
            box-shadow: 0 3px #57606f;
        }
        .btn-op {
            background: #e67e22;
            color: white;
            box-shadow: 0 3px #d35400;
        }
        .btn-ac {
            background: #e74c3c;
            color: white;
            box-shadow: 0 3px #c0392b;
        }
        .btn-eq {
            background: #27ae60;
            color: white;
            box-shadow: 0 3px #219653;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="brand">
            <span>CASIO fx-580VN X</span>
            <span>NATURAL-V.P.A.P.</span>
        </div>
        
        <div class="screen">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <div class="keypad">
            <button class="btn btn-sci" onclick="appendValue('sin(')">sin</button>
            <button class="btn btn-sci" onclick="appendValue('cos(')">cos</button>
            <button class="btn btn-sci" onclick="appendValue('tan(')">tan</button>
            <button class="btn btn-ac" onclick="clearAll()">AC</button>

            <button class="btn btn-sci" onclick="appendValue('log(')">log</button>
            <button class="btn btn-sci" onclick="appendValue('ln(')">ln</button>
            <button class="btn btn-sci" onclick="appendValue('Math.sqrt(')">√</button>
            <button class="btn btn-sci" onclick="deleteChar()">DEL</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn btn-op" onclick="appendValue('/')">÷</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn btn-op" onclick="appendValue('*')">×</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn btn-op" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            <button class="btn btn-eq" onclick="calculate()">=</button>
            <button class="btn btn-op" onclick="appendValue('+')">+</button>
        </div>
    </div>

    <script>
        let currentExpr = "";
        const exprEl = document.getElementById('expression');
        const resEl = document.getElementById('result');

        function appendValue(val) {
            currentExpr += val;
            exprEl.innerText = currentExpr;
        }

        function clearAll() {
            currentExpr = "";
            exprEl.innerText = "";
            resEl.innerText = "0";
        }

        function deleteChar() {
            currentExpr = currentExpr.slice(0, -1);
            exprEl.innerText = currentExpr;
        }

        function calculate() {
            try {
                // Safely evaluate the expression
                let evalString = currentExpr
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');
                let result = eval(evalString);
                resEl.innerText = result;
            } catch (error) {
                resEl.innerText = "Lỗi";
            }
        }
    </script>

</body>
</html>
